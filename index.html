<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WayFinding Plaza Central Mobile</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <link rel="stylesheet" href="/css/main.css" />
  <style>

    .landscape-warning {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            z-index: 9999;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .landscape-warning h2 {
            margin-bottom: 20px;
            font-size: 24px;
        }

        .landscape-warning p {
            font-size: 16px;
            line-height: 1.5;
        }

        @media screen and (orientation: landscape) and (max-width: 896px) {
            .landscape-warning {
                display: flex;
            }
            
            .content-layer {
                display: none;
            }
        }

    #map-layer {
      position: absolute;
      top: 50px;
      left: 0;
      width: 100vw;
      height: calc(100vh - 50px);
      z-index: 1;
      background: rgba(0, 0, 0, 0.1);
    }

    #mi-contenedor {
      height: 100%;
      width: 100%;
      position: relative;
    }

    #content-layer {
      position: absolute;
      top: 50px;
      left: 0;
      width: 100vw;
      height: calc(100vh - 50px);
      z-index: 2;
      background-image: url('../assets/background.png');
      background-repeat: no-repeat;
      background-size: cover;
      transition: opacity 0.3s ease;
    }

    body.map-mode #content-layer {
      opacity: 0;
      pointer-events: none;
    }

    body.map-mode #map-layer {
      z-index: 10;
    }

    .side-menu {
      position: fixed;
      top: 0;
      left: -70%;
      width: 70%;
      height: 100vh;
      background-color: white;
      box-shadow: 2px 0 5px rgba(0, 0, 0, 0.2);
      transition: left 0.3s ease;
      z-index: 1000;
      padding: 20px 10px;
    }

    body.map-mode .side-menu {
      z-index: 1001;
    }

    #menu-toggle:checked ~ #content-layer .side-menu,
    #menu-toggle:checked ~ .side-menu {
      left: 0;
    }

    .menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      z-index: 999;
      display: none;
    }

    #menu-toggle:checked ~ .menu-overlay {
      display: block;
    }

    .map-controls {
      position: absolute;
      bottom: 20px;
      right: 16px;
      height: calc(100vh - 140px);
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 11;
    }

    .map-controls button {
      width: 22px;
      height: 22px;
      background-color: #8BB800;
      color: #ffffff;
      border: none;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      cursor: pointer;
      font-weight: bold;
      font-size: 18px;
    }

    #zoom-reset {
      background-image: url(/assets/reset.svg);
      background-size: contain;
      background-repeat: no-repeat;
    }

    #zoom-out {
      background-image: url(/assets/zoom_out.svg);
      background-size: contain;
      background-repeat: no-repeat;
    }

    #zoom-in {
      background-image: url(/assets/zoom_in.svg);
      background-size: contain;
      background-repeat: no-repeat;
    }

    .map-controls button:hover {
      background: #f0f0f0;
    }

    .close-map-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      cursor: pointer;
      z-index: 12;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    body.map-mode .close-map-btn {
      display: flex;
    }

    .search-container,
    .results-container,
    .slider-container {
      position: relative;
      z-index: 3;
    }

    #main-content {
      position: relative;
      z-index: 3;
    }

    .header {
      position: relative;
      z-index: 100;
    }
  </style>
</head>
<body>
  <input type="checkbox" id="menu-toggle" hidden />

  <header class="header">
    <div class="left-section">
      <label for="menu-toggle" class="menu-icon">
        <span class="hamburger"></span>
      </label>
      <a href="index.html" class="logo">
        LO<br>GO
      </a>
    </div>
    <button class="map-button" onclick="showMap()">Mapa</button>
  </header>

  <div class="menu-overlay" onclick="closeMenu()"></div>

  <div class="side-menu">
    <div class="close-container">
      <label for="menu-toggle" class="close-icon">
        <span class="hamburger"></span>
        <div class="logo-menu">LOGO</div>
      </label>
    </div>
    <div class="menu-items">
    </div>
  </div>

  <div id="map-layer">
    <div id="mi-contenedor"></div>
    <div class="map-controls">
      <button id="zoom-reset"></button>
      <button id="zoom-in"></button>
      <button id="zoom-out"></button>
    </div>
    <button class="close-map-btn" onclick="hideMap()">×</button>
  </div>

  <div id="content-layer">
    <div class="search-container">
      <img class="search-icon" />
      <input type="text" placeholder="Buscar" class="search-input" />
    </div>

    <div id="results" class="results-container"></div>

    <div class="slider-container">
    </div>

    <div 
      id="main-content"
      hx-get="/components/category.html"
      hx-trigger="load"
      hx-swap="innerHTML"
    ></div>
  </div>

  <script>
    // ========== ESTADO GLOBAL ==========
    let appState = {
      domReady: false,
      mapInitialized: false,
      menuLoaded: false,
      retryCount: 0,
      maxRetries: 3,
      // Sistema de estado más robusto
      currentPage: null,
      isInitializing: false,
      loadingQueue: new Set(),
      // Identificador único para cada sesión
      sessionId: Date.now() + Math.random()
    };

    // ========== FUNCIONES DE UTILIDAD ==========
    function resetAppState() {
      console.log('Resetting app state for session:', appState.sessionId);
      appState.currentPage = null;
      appState.isInitializing = false;
      appState.loadingQueue.clear();
    }

    function shouldProcessPage(url, pageType) {
      const key = `${pageType}-${url}`;
      if (appState.loadingQueue.has(key)) {
        console.log('Skipping duplicate processing for:', key);
        return false;
      }
      appState.loadingQueue.add(key);
      
      // Limpiar entradas antiguas después de un tiempo
      setTimeout(() => {
        appState.loadingQueue.delete(key);
      }, 5000);
      
      return true;
    }

    // ========== FUNCIONES EXISTENTES ==========
    function showMap() {
      document.body.classList.add('map-mode');
      
      const menuToggle = document.getElementById('menu-toggle');
      if (menuToggle.checked) {
        menuToggle.checked = false;
      }
    }

    function hideMap() {
      document.body.classList.remove('map-mode');
    }

    function closeMenu() {
      const menuToggle = document.getElementById('menu-toggle');
      if (menuToggle) {
        menuToggle.checked = false;
      }
    }

    window.showMapFromMenu = function() {
      closeMenu();
      setTimeout(() => {
        showMap();
      }, 300);
      return false;
    };

    let mapsdk;
    
    async function initializeMap() {
      if (appState.mapInitialized) return;
      
      try {
        const mapContainer = document.getElementById('mi-contenedor');
        if (!mapContainer) {
          console.warn('Map container not found, retrying...');
          if (appState.retryCount < appState.maxRetries) {
            appState.retryCount++;
            setTimeout(initializeMap, 1000);
          }
          return;
        }

        const client = {
          map_key: 'mik_NiqvvlUUGDWjonwI35a3a07e7',
          map_secret: 'mis_GlIrmk29gCx4HsyyLzpvQtUNLYh0dWIHKzEJ4FIC0j698b71024',
          map_id: '67f54b1a73bd2d000bfb1700'
        };
        
        const module = await import('./wf_mapsdk/main.js');
        const { WFMapSDK } = module;
        mapsdk = new WFMapSDK(client, "mi-contenedor", "zoom-in", "zoom-out", "zoom-reset");
        appState.mapInitialized = true;
        console.log('Map initialized successfully');
        
      } catch (error) {
        console.error('Error loading map SDK:', error);
        if (appState.retryCount < appState.maxRetries) {
          appState.retryCount++;
          console.log(`Retrying map initialization (${appState.retryCount}/${appState.maxRetries})`);
          setTimeout(initializeMap, 2000);
        }
      }
    }

    function ensureDOMReady(callback) {
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', callback);
      } else {
        callback();
      }
    }

    function waitForElement(selector, timeout = 4000) {
      return new Promise((resolve, reject) => {
        const element = document.querySelector(selector);
        if (element) {
          resolve(element);
          return;
        }

        const observer = new MutationObserver((mutations, obs) => {
          const element = document.querySelector(selector);
          if (element) {
            obs.disconnect();
            resolve(element);
          }
        });

        observer.observe(document.body, {
          childList: true,
          subtree: true
        });

        setTimeout(() => {
          observer.disconnect();
          reject(new Error(`Element ${selector} not found within ${timeout}ms`));
        }, timeout);
      });
    }
  </script>

  <script type="module">
    import { loadCategories } from "/src/category.js";
    import { loadSubcategories } from "/src/subcategory.js";
    import { loadPois } from "/src/poi.js";
    import { loadContent, showSlider } from "/src/content.js";
    import { loadMenu } from "/src/menu.js";

    // Hacer las funciones disponibles globalmente
    window.loadCategories = loadCategories;
    window.showSlider = showSlider;

    // ========== INICIALIZACIÓN PRINCIPAL ==========
    async function safeInitialize() {
      if (appState.isInitializing) {
        console.log('Initialization already in progress, skipping...');
        return;
      }
      
      appState.isInitializing = true;
      console.log('Starting safe initialization for session:', appState.sessionId);
      
      try {
        // Esperar a que el DOM esté completamente listo
        await new Promise(resolve => {
          if (document.readyState === 'complete') {
            resolve();
          } else {
            window.addEventListener('load', resolve);
          }
        });

        await waitForElement('.menu-items');
        await loadMenuWithRetry();
        await initializeMap();
        
        console.log('Initialization completed successfully');
        
      } catch (error) {
        console.error('Error during initialization:', error);
        setTimeout(() => {
          appState.isInitializing = false;
          safeInitialize();
        }, 2000);
      } finally {
        appState.isInitializing = false;
      }
    }

    // ========== FUNCIONES DE CARGA CON RETRY ==========
    async function loadCategoriesWithRetry(maxRetries = 3) {
      return await queueRequest('categories', async () => {
        for (let attempt = 1; attempt <= maxRetries; attempt++) {
          try {
            console.log(`Loading categories - Attempt ${attempt}/${maxRetries}`);
            
            // Verificar que las funciones estén disponibles
            if (typeof window.loadCategories !== 'function') {
              throw new Error('loadCategories function not available');
            }
            
            await window.loadCategories();
            console.log('Categories loaded successfully on attempt', attempt);
            return; // Éxito, salir del loop
            
          } catch (error) {
            console.error(`Category load attempt ${attempt} failed:`, error);
            
            if (attempt === maxRetries) {
              console.error('All category load attempts failed');
              showErrorMessage('Error cargando categorías. Por favor, recarga la página.');
              throw error;
            }
            
            // Esperar más tiempo entre intentos (backoff exponencial)
            const delay = Math.min(1000 * Math.pow(2, attempt - 1), 4000);
            console.log(`Waiting ${delay}ms before retry...`);
            await new Promise(resolve => setTimeout(resolve, delay));
          }
        }
      });
    }

    async function loadSubcategoriesWithRetry(categoryID, maxRetries = 3) {
      return await queueRequest(`subcategories-${categoryID}`, async () => {
        for (let attempt = 1; attempt <= maxRetries; attempt++) {
          try {
            console.log(`Loading subcategories for ${categoryID} - Attempt ${attempt}/${maxRetries}`);
            await loadSubcategories(categoryID);
            console.log('Subcategories loaded successfully on attempt', attempt);
            return;
          } catch (error) {
            console.error(`Subcategory load attempt ${attempt} failed:`, error);
            if (attempt === maxRetries) {
              showErrorMessage('Error cargando subcategorías. Por favor, intenta de nuevo.');
              throw error;
            }
            await new Promise(resolve => setTimeout(resolve, 1000 * attempt));
          }
        }
      });
    }

    async function loadPoisWithRetry(subcategoryID, maxRetries = 3) {
      return await queueRequest(`pois-${subcategoryID}`, async () => {
        for (let attempt = 1; attempt <= maxRetries; attempt++) {
          try {
            console.log(`Loading POIs for ${subcategoryID} - Attempt ${attempt}/${maxRetries}`);
            await loadPois(subcategoryID);
            console.log('POIs loaded successfully on attempt', attempt);
            return;
          } catch (error) {
            console.error(`POI load attempt ${attempt} failed:`, error);
            if (attempt === maxRetries) {
              showErrorMessage('Error cargando ubicaciones. Por favor, intenta de nuevo.');
              throw error;
            }
            await new Promise(resolve => setTimeout(resolve, 1000 * attempt));
          }
        }
      });
    }

    async function loadContentWithRetry(contentType, maxRetries = 3) {
      return await queueRequest(`content-${contentType}`, async () => {
        for (let attempt = 1; attempt <= maxRetries; attempt++) {
          try {
            console.log(`Loading content for ${contentType} - Attempt ${attempt}/${maxRetries}`);
            await loadContent(contentType);
            console.log('Content loaded successfully on attempt', attempt);
            return;
          } catch (error) {
            console.error(`Content load attempt ${attempt} failed:`, error);
            if (attempt === maxRetries) {
              showErrorMessage('Error cargando contenido. Por favor, intenta de nuevo.');
              throw error;
            }
            await new Promise(resolve => setTimeout(resolve, 1000 * attempt));
          }
        }
      });
    }

    async function loadMenuWithRetry(retries = 3) {
      for (let i = 0; i < retries; i++) {
        try {
          await loadMenu();
          appState.menuLoaded = true;
          console.log('Menu loaded successfully');
          return;
        } catch (error) {
          console.warn(`Menu load attempt ${i + 1} failed:`, error);
          if (i === retries - 1) throw error;
          await new Promise(resolve => setTimeout(resolve, 1000));
        }
      }
    }

    // ========== MANEJADOR UNIFICADO DE HTMX ==========
    async function handlePageLoad(url, target) {
      console.log('Processing page load:', url, 'Target:', target?.id);
      
      if (!url || target?.id !== "main-content") return;
      
      // Esperar más tiempo para asegurar estabilidad del DOM y servidor
      await new Promise(resolve => setTimeout(resolve, 300));

      try {
        // Categorías (página inicial o navegación)
        if (url.includes("category.html") && !url.includes("subcategory.html")) {
          if (!shouldProcessPage(url, 'category')) return;
          
          console.log('Loading categories page');
          appState.currentPage = 'categories';
          showSlider();
          
          // Implementar retry con backoff para requests de categorías
          await loadCategoriesWithRetry();
          console.log('Categories loaded successfully');
        }
        
        // Subcategorías
        else if (url.includes("subcategory.html")) {
          if (!shouldProcessPage(url, 'subcategory')) return;
          
          console.log('Loading subcategories page');
          appState.currentPage = 'subcategories';
          
          const urlParts = url.split('?');
          if (urlParts.length > 1) {
            const urlParams = new URLSearchParams(urlParts[1]);
            const categoryID = urlParams.get('categoryID');
            
            if (categoryID) {
              await loadSubcategoriesWithRetry(categoryID);
              console.log('Subcategories loaded for category:', categoryID);
            } else {
              console.error("No categoryID found in URL");
            }
          }
        }
        
        // POIs
        else if (url.includes("poi.html")) {
          if (!shouldProcessPage(url, 'poi')) return;
          
          console.log('Loading POIs page');
          appState.currentPage = 'pois';
          
          const urlParts = url.split('?');
          if (urlParts.length > 1) {
            const urlParams = new URLSearchParams(urlParts[1]);
            const subcategoryID = urlParams.get('subcategoryID');
            
            if (subcategoryID) {
              await loadPoisWithRetry(subcategoryID);
              console.log('POIs loaded for subcategory:', subcategoryID);
            } else {
              console.error("No subcategoryID found in URL");
            }
          }
        }
        
        // Contenido
        else if (url.includes("content.html")) {
          if (!shouldProcessPage(url, 'content')) return;
          
          console.log('Loading content page');
          appState.currentPage = 'content';
          closeMenu();
          
          const urlParts = url.split('?');
          let contentType = 'all';
          if (urlParts.length > 1) {
            const urlParams = new URLSearchParams(urlParts[1]);
            contentType = urlParams.get('typeId') || 'all';
          }
          
          await loadContentWithRetry(contentType);
          console.log('Content loaded for type:', contentType);
        }
        
        // Mapa
        else if (url.includes("map.html")) {
          console.log('Showing map');
          appState.currentPage = 'map';
          showMap();
        }
        
      } catch (error) {
        console.error('Error processing page load:', error);
      }
    }

    // ========== PREVENCIÓN DE REQUESTS CONCURRENTES ==========
    
    let requestQueue = new Map();
    
    async function queueRequest(key, requestFn) {
      // Si ya hay un request en progreso para esta key, esperar a que termine
      if (requestQueue.has(key)) {
        console.log(`Request for ${key} already in progress, waiting...`);
        return await requestQueue.get(key);
      }
      
      // Crear y ejecutar el request
      const requestPromise = requestFn();
      requestQueue.set(key, requestPromise);
      
      try {
        const result = await requestPromise;
        return result;
      } finally {
        // Limpiar el request de la cola
        requestQueue.delete(key);
      }
    }

    // ========== EVENT LISTENERS ==========
    
    // Usar solo afterSwap para evitar duplicaciones
    document.body.addEventListener("htmx:afterSwap", async (evt) => {
      const url = evt.detail.xhr?.responseURL || "";
      await handlePageLoad(url, evt.detail.target);
    });

    // Detectar recargas de página
    window.addEventListener('beforeunload', () => {
      console.log('Page unloading, cleaning up...');
      resetAppState();
    });

    // Detectar cuando la página viene del caché
    window.addEventListener('pageshow', (event) => {
      if (event.persisted) {
        console.log('Page loaded from cache, resetting state...');
        resetAppState();
      }
    });

    // ========== INICIALIZACIÓN ==========
    
    // Inicializar la aplicación
    safeInitialize();

    // Manejar carga inicial de categorías si es necesario
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(async () => {
        const mainContent = document.getElementById('main-content');
        if (mainContent && !appState.currentPage) {
          console.log('DOM ready, checking for initial category load...');
          try {
            if (typeof window.showSlider === 'function' && typeof window.loadCategories === 'function') {
              showSlider();
              await loadCategories();
              appState.currentPage = 'categories';
              console.log('Initial categories loaded on DOM ready');
            }
          } catch (error) {
            console.error('Error loading initial categories on DOM ready:', error);
          }
        }
      }, 500);
    });
  </script>
  <script src="/src/search.js"></script>
</body>
</html>
